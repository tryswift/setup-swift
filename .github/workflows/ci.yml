name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck ./*.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  install:
    name: install (${{ matrix.os }}, ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        swift: ["6.4.1", "6.3.3"]
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        with:
          swift-version: ${{ matrix.swift }}
      - name: Check outputs and compile
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          SWIFT_PATH: ${{ steps.setup.outputs.swift-path }}
          SOURCE: ${{ steps.setup.outputs.source }}
        run: |
          set -euo pipefail
          echo "source=$SOURCE swift-path=$SWIFT_PATH"
          test "$VERSION" = "${{ matrix.swift }}"
          ls "$SWIFT_PATH"/swift*
          mkdir hello && cd hello
          swift package init --type executable --name hello
          swift run
          echo "$SOURCE" > ../source.txt
      - uses: actions/upload-artifact@v7
        with:
          name: source-${{ matrix.os }}-${{ matrix.swift }}
          path: source.txt

  # Runs after `install` so the Linux toolchain cache it saved is available.
  cache-hit:
    name: cache hit (${{ matrix.os }}, ${{ matrix.swift }})
    needs: install
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
        swift: ["6.4.1", "6.3.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: source-${{ matrix.os }}-${{ matrix.swift }}
      - id: setup
        uses: ./
        with:
          swift-version: ${{ matrix.swift }}
      - name: Expect preinstalled or cached toolchain (no download)
        env:
          SOURCE: ${{ steps.setup.outputs.source }}
        run: |
          first="$(cat source.txt)"
          echo "first run: $first, second run: $SOURCE"
          # Runner images differ in what they preinstall; only a first-run download must be cached.
          if [ "$first" = download ]; then
            test "$SOURCE" = cache || { echo "::error::expected a cache hit, got $SOURCE"; exit 1; }
          fi

  unsupported-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        continue-on-error: true
        with:
          swift-version: "6.99.99"
      - name: Expect a clear failure
        run: test "${{ steps.setup.outcome }}" = "failure"

  swift-sdks:
    name: sdks (${{ matrix.sdk }}, ${{ matrix.os }}, ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.4.1", "6.3.3"]
        include:
          - { sdk: static-linux, os: ubuntu-24.04, id: 'x86_64-swift-linux-musl', build_args: "" }
          - { sdk: wasm, os: ubuntu-24.04, id: '_wasm$', build_args: "" }
          - { sdk: android, os: ubuntu-24.04, id: 'aarch64-unknown-linux-android28', build_args: "--static-swift-stdlib" }
          # macos-latest ships NDK r27, too old to link the Swift 6.4 Android SDK (needs r30): not built here.
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        with:
          swift-version: ${{ matrix.swift }}
          swift-sdks: ${{ matrix.sdk }}
      - name: Build hello world with the SDK
        env:
          SDK_ID: ${{ matrix.id }}
          BUILD_ARGS: ${{ matrix.build_args }}
          SDKS: ${{ steps.setup.outputs.sdks }}
        run: |
          set -euo pipefail
          echo "$SDKS"
          # `swift sdk list` shows bundle ids; target triples (static Linux, Android) are accepted as is.
          id="$(grep -E -m1 -- "$SDK_ID" <<< "$SDKS" || echo "$SDK_ID")"
          mkdir hello && cd hello
          swift package init --type executable --name hello
          # shellcheck disable=SC2086
          swift build --swift-sdk "$id" $BUILD_ARGS

  sdk-missing-checksum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        continue-on-error: true
        with:
          swift-version: "6.4.1"
          swift-sdks: bogus
      - name: Expect a clear failure
        run: test "${{ steps.setup.outcome }}" = "failure"
