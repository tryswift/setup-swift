name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck ./*.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  install:
    name: install (${{ matrix.os }}, ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        swift: ["6.4.1", "6.3.3"]
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        with:
          swift-version: ${{ matrix.swift }}
      - name: Check outputs and compile
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          SWIFT_PATH: ${{ steps.setup.outputs.swift-path }}
          SOURCE: ${{ steps.setup.outputs.source }}
        run: |
          set -euo pipefail
          echo "source=$SOURCE swift-path=$SWIFT_PATH"
          test "$VERSION" = "${{ matrix.swift }}"
          ls "$SWIFT_PATH"/swift*
          mkdir hello && cd hello
          swift package init --type executable --name hello
          swift run

  # Runs after `install` so the Linux toolchain cache it saved is available.
  cache-hit:
    name: cache hit (${{ matrix.os }}, ${{ matrix.swift }})
    needs: install
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
        swift: ["6.4.1", "6.3.3"]
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        with:
          swift-version: ${{ matrix.swift }}
      - name: Expect the archive to come from the cache (and be re-verified)
        env:
          SOURCE: ${{ steps.setup.outputs.source }}
        run: test "$SOURCE" = cache

  unsupported-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        continue-on-error: true
        with:
          swift-version: "6.99.99"
      - name: Expect a clear failure
        run: test "${{ steps.setup.outcome }}" = "failure"

  swift-sdks:
    name: sdks (${{ matrix.sdk }}, ${{ matrix.os }}, ${{ matrix.swift }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { swift: '6.4.1', sdk: static-linux, os: ubuntu-24.04, id: 'x86_64-swift-linux-musl', build_args: "" }
          - { swift: '6.4.1', sdk: wasm, os: ubuntu-24.04, id: '_wasm$', build_args: "" }
          - { swift: '6.4.1', sdk: android, os: ubuntu-24.04, id: 'aarch64-unknown-linux-android28', build_args: "--static-swift-stdlib" }
          - { swift: '6.3.3', sdk: static-linux, os: ubuntu-24.04, id: 'x86_64-swift-linux-musl', build_args: "" }
          - { swift: '6.3.3', sdk: wasm, os: ubuntu-24.04, id: '_wasm$', build_args: "" }
          - { swift: '6.3.3', sdk: android, os: ubuntu-24.04, id: 'aarch64-unknown-linux-android28', build_args: "--static-swift-stdlib" }
          # Only 6.4.1: the 6.3.3 macOS host toolchain lacks swift-autolink-extract, so it cannot link Android.
          - { swift: '6.4.1', sdk: android, os: macos-latest, id: 'aarch64-unknown-linux-android28', build_args: "--static-swift-stdlib" }
    steps:
      - uses: actions/checkout@v7
      # Runner images ship NDK r27; the Swift Android SDK needs r30 to link.
      - name: Install Android NDK r30
        if: matrix.sdk == 'android'
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mgr="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          pkg="$("$mgr" --list 2> /dev/null | grep -o 'ndk;30[0-9.]*' | sort -V | tail -1)"
          echo "Installing $pkg"
          yes | "$mgr" --licenses > /dev/null || true
          "$mgr" --install "$pkg" > /dev/null
          { echo "ANDROID_NDK_HOME=$sdkroot/ndk/${pkg#ndk;}"; echo "ANDROID_NDK_ROOT=$sdkroot/ndk/${pkg#ndk;}"; echo "ANDROID_NDK_LATEST_HOME=$sdkroot/ndk/${pkg#ndk;}"; } >> "$GITHUB_ENV"
      - id: setup
        uses: ./
        with:
          swift-version: ${{ matrix.swift }}
          swift-sdks: ${{ matrix.sdk }}
      - name: Build hello world with the SDK
        env:
          SDK_ID: ${{ matrix.id }}
          BUILD_ARGS: ${{ matrix.build_args }}
          SDKS: ${{ steps.setup.outputs.sdks }}
        run: |
          set -euo pipefail
          echo "$SDKS"
          # `swift sdk list` shows bundle ids; target triples (static Linux, Android) are accepted as is.
          id="$(grep -E -m1 -- "$SDK_ID" <<< "$SDKS" || echo "$SDK_ID")"
          mkdir hello && cd hello
          swift package init --type executable --name hello
          # shellcheck disable=SC2086
          swift build --swift-sdk "$id" $BUILD_ARGS

  sdk-missing-checksum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        continue-on-error: true
        with:
          swift-version: "6.4.1"
          swift-sdks: bogus
      - name: Expect a clear failure
        run: test "${{ steps.setup.outcome }}" = "failure"

  # Tampering with anything on disk must fail closed, and nothing pre-existing may be executed.
  fail-closed:
    runs-on: ubuntu-24.04
    env:
      SWIFT_VERSION: "6.3.3"
    steps:
      - uses: actions/checkout@v7
      - name: Archive cache is re-verified, tampering fails closed, planted toolchains are ignored
        run: |
          set -euo pipefail
          export RUNNER_TEMP="${RUNNER_TEMP:-/tmp}" GITHUB_OUTPUT="$PWD/out.txt" GITHUB_PATH="$PWD/path.txt"
          : > "$GITHUB_OUTPUT"; : > "$GITHUB_PATH"
          bash plan-linux.sh
          export SWIFT_URL SWIFT_FILE
          SWIFT_URL="$(sed -n 's/^url=//p' out.txt)"; SWIFT_FILE="$(sed -n 's/^file=//p' out.txt)"
          dl="$RUNNER_TEMP/dl-cache"

          echo "== 1. populate: downloads and verifies"
          DOWNLOAD_DIR="$dl" bash install-linux.sh
          grep -q '^source=download$' out.txt

          echo "== 2. second run re-verifies the cached archive"
          DOWNLOAD_DIR="$dl" bash install-linux.sh
          tail -1 out.txt | grep -q '^source=cache$'
          test "$(grep -c . path.txt)" -eq 2
          test "$(sort -u path.txt | wc -l)" -eq 2   # a fresh directory per run

          echo "== 3. planted extracted tree and fake swift are never used (cache disabled)"
          planted="$RUNNER_TOOL_CACHE/swift/planted"
          mkdir -p "$planted/usr/bin"
          printf '#!/bin/sh\ntouch "%s/planted-ran"\n' "$RUNNER_TEMP" > "$planted/usr/bin/swift"
          chmod +x "$planted/usr/bin/swift"
          : > path.txt
          env -u DOWNLOAD_DIR bash install-linux.sh
          tail -1 out.txt | grep -q '^source=download$'
          if grep -q planted path.txt; then exit 1; fi
          test ! -e "$RUNNER_TEMP/planted-ran"

          echo "== 4. tampered archive fails closed (no silent re-download)"
          cp -r "$dl" "$RUNNER_TEMP/dl-bad-archive"
          printf 'x' >> "$RUNNER_TEMP/dl-bad-archive/$SWIFT_FILE"
          : > path.txt
          if DOWNLOAD_DIR="$RUNNER_TEMP/dl-bad-archive" bash install-linux.sh; then echo "tampered archive was accepted"; exit 1; fi
          test ! -s path.txt

          echo "== 5. tampered signature fails closed"
          cp -r "$dl" "$RUNNER_TEMP/dl-bad-sig"
          head -c 100 "$dl/$SWIFT_FILE.sig" > "$RUNNER_TEMP/dl-bad-sig/$SWIFT_FILE.sig"
          if DOWNLOAD_DIR="$RUNNER_TEMP/dl-bad-sig" bash install-linux.sh; then echo "tampered signature was accepted"; exit 1; fi
          test ! -s path.txt

  fake-preinstalled:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Put a fake swift first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          printf '#!/bin/sh\ntouch "%s/fake-swift-ran"\necho "Swift version 6.3.3 (fake)"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/fake/swift"
          chmod +x "$RUNNER_TEMP/fake/swift"
          echo "$RUNNER_TEMP/fake" >> "$GITHUB_PATH"
      - id: secure
        uses: ./
        with:
          swift-version: "6.3.3"
      - name: Default never executes the pre-existing swift
        run: |
          test ! -e "$RUNNER_TEMP/fake-swift-ran"
          test "${{ steps.secure.outputs.source }}" != preinstalled
          swift --version | grep -q 'swift-6.3.3-RELEASE'
      - id: optin
        uses: ./
        with:
          swift-version: "6.3.3"
          use-preinstalled: "true"
      - name: Opt-in uses the (unverified) swift on PATH
        run: |
          # The verified toolchain from the previous step is still first on PATH, so it is the one found.
          test "${{ steps.optin.outputs.source }}" = preinstalled
