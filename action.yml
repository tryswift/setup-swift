name: Setup Swift
description: >-
  Installs an exact swift.org toolchain. Linux tarballs are GPG-verified against
  pinned swift.org signing keys; macOS packages must be notarized and signed by
  the Swift Open Source Developer ID team. Replaces swift-actions/setup-swift.
inputs:
  swift-version:
    description: Exact toolchain version, e.g. "6.4.1".
    required: true
  swift-sdks:
    description: >-
      Comma or space separated Swift SDKs to install after the toolchain: static-linux, wasm, android.
      Each bundle is checked against the sha256 pinned in sdk-checksums.txt.
    required: false
    default: ""
  use-preinstalled:
    description: >-
      UNVERIFIED: if `swift` on PATH already reports exactly swift-version, run and use it instead of
      installing a verified toolchain. Default false: pre-existing binaries are never executed.
    required: false
    default: "false"
  cache:
    description: >-
      Cache the downloaded Linux toolchain archive and its signature with actions/cache. The archive is
      re-verified with GPG on every run; with false nothing on disk is ever reused.
    required: false
    default: "true"
outputs:
  sdks:
    description: Output of `swift sdk list` after installing swift-sdks (empty if none requested).
    value: ${{ steps.sdks.outputs.sdks }}
  swift-path:
    description: Directory containing the active swift binary.
    value: ${{ steps.report.outputs.swift-path }}
  version:
    description: The version reported by swift --version.
    value: ${{ steps.report.outputs.version }}
  source:
    description: Where the toolchain came from (preinstalled, cache, download, pkg or installer).
    value: ${{ steps.report.outputs.source }}
runs:
  using: composite
  steps:
    - name: Validate inputs and optionally accept a preinstalled Swift
      id: existing
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
        USE_PREINSTALLED: ${{ inputs.use-preinstalled }}
      run: |
        set -euo pipefail
        if [[ ! "$SWIFT_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          echo "::error::swift-version must be an exact version like 6.4.1, got '$SWIFT_VERSION'"
          exit 1
        fi
        # Pre-existing binaries are executed only on explicit opt-in.
        pattern="Swift version ${SWIFT_VERSION//./\\.}[ (]"
        if [ "$USE_PREINSTALLED" = true ] && command -v swift > /dev/null && swift --version 2>&1 | grep -Eq "$pattern"; then
          echo "::warning::use-preinstalled: using an unverified Swift $SWIFT_VERSION already on PATH"
          echo "Swift $SWIFT_VERSION is already installed; using it."
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Plan Linux toolchain install
      id: plan
      if: steps.existing.outputs.found != 'true' && runner.os == 'Linux'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: bash "$GITHUB_ACTION_PATH/plan-linux.sh"

    - name: Restore Swift toolchain cache
      if: steps.existing.outputs.found != 'true' && runner.os == 'Linux' && inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.plan.outputs.download-dir }}
        key: ${{ steps.plan.outputs.cache-key }}

    - name: Install Swift (Linux, GPG verified)
      id: linux
      if: steps.existing.outputs.found != 'true' && runner.os == 'Linux'
      shell: bash
      env:
        SWIFT_URL: ${{ steps.plan.outputs.url }}
        SWIFT_FILE: ${{ steps.plan.outputs.file }}
        INSTALL_DIR: ${{ steps.plan.outputs.install-dir }}
        DOWNLOAD_DIR: ${{ inputs.cache == 'true' && steps.plan.outputs.download-dir || '' }}
      run: bash "$GITHUB_ACTION_PATH/install-linux.sh"

    - name: Install Swift (macOS, signature verified)
      id: macos
      if: steps.existing.outputs.found != 'true' && runner.os == 'macOS'
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: bash "$GITHUB_ACTION_PATH/install-macos.sh"

    - name: Install Swift (Windows, Authenticode verified)
      id: windows
      if: steps.existing.outputs.found != 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
      run: '& "$env:GITHUB_ACTION_PATH/install-windows.ps1"'

    - name: Report Swift version
      id: report
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
        SOURCE: ${{ steps.linux.outputs.source || steps.macos.outputs.source || steps.windows.outputs.source || 'preinstalled' }}
      run: |
        set -euo pipefail
        swift --version
        reported="$(swift --version 2>&1 | grep -Eo 'Swift version [0-9.]+' | head -1 | awk '{print $3}')"
        if [ "$reported" != "$SWIFT_VERSION" ]; then
          echo "::error::Requested Swift $SWIFT_VERSION but 'swift --version' reports '${reported:-unknown}'"
          exit 1
        fi
        echo "swift-path=$(dirname "$(command -v swift)")" >> "$GITHUB_OUTPUT"
        echo "version=$reported" >> "$GITHUB_OUTPUT"
        echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

    - name: Install Swift SDKs
      id: sdks
      if: inputs.swift-sdks != ''
      shell: bash
      env:
        SWIFT_VERSION: ${{ inputs.swift-version }}
        SWIFT_SDKS: ${{ inputs.swift-sdks }}
      run: bash "$GITHUB_ACTION_PATH/install-sdks.sh"
